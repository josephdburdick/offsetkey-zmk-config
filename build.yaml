include:
  - board: eyelash_nano
    shield: offsetkey_peripheral_left
  - board: eyelash_nano
    shield: offsetkey_peripheral_right
  - board: eyelash_nano
    shield: offsetkey_central_dongle dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: offsetkey_dongle
  - board: eyelash_nano
    shield: offsetkey_central_dongle dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n -DCONFIG_ZMK_DONGLE_DISPLAY_SCROLL_LAYER=-1
    artifact-name: offsetkey_dongle_anymotion
  - board: eyelash_nano
    shield: settings_reset
